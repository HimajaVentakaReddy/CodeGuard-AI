spring.application.name=CodeGuard AI
codeguard.info.name=CodeGuard AI
codeguard.info.version=1.0.0
codeguard.info.description=Intelligent Code Quality & Vulnerability Analyzer
spring.servlet.multipart.max-file-size=100KB
spring.servlet.multipart.max-request-size=120KB
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/codeguard_ai?serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:update}
spring.jpa.open-in-view=false
